services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiv
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: shiv_cement
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - shiv_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiv -d shiv_cement']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  shiv_postgres:
