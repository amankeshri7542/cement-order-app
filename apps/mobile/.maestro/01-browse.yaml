# A stranger: no language gate and no sign-in wall. Reads rates, searches, adds, reads a product.
appId: in.shivcement.store
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Today's rates
    timeout: 20000
- assertVisible: Sample rates
- assertNotVisible: Choose your language
- assertVisible: Home
- assertVisible: Orders
- assertVisible: Account
- tapOn: Search
- inputText: saria
- hideKeyboard
- extendedWaitUntil:
    visible: Tata Tiscon 550SD.*
    timeout: 5000
- tapOn: Add Tata Tiscon 550SD to your list
- extendedWaitUntil:
    visible: Your list.*
    timeout: 3000
- back
- tapOn:
    text: Orders
    index: 0
- assertVisible: Sign in to see your orders
- tapOn:
    text: Account
    index: 0
- assertVisible: Sign in
- assertVisible: Privacy
- assertNotVisible: Udhaar
