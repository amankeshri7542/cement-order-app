# Smoke: sign in with the local mock code and add a product to the cart.
# Uses a fresh test number each run (the API allows one code a minute per number).
# Local API only: the code is read from the "Local development code" notice.
appId: in.shivcement.store
tags: [smoke]
---
- evalScript: ${output.phone = '98888' + String(Math.floor(10000 + Math.random() * 89999))}
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Browse materials
    timeout: 15000
- tapOn: Account
- tapOn:
    text: Sign in
    optional: true
- tapOn: 10-digit mobile number
- inputText: ${output.phone}
- hideKeyboard
- tapOn: Get verification code
- extendedWaitUntil:
    visible: Local development code.*
    timeout: 10000
- copyTextFrom:
    text: Local development code.*
- evalScript: ${output.code = maestro.copiedText.match(/\d{6}/)[0]}
- tapOn: 6-digit code
- inputText: ${output.code}
- hideKeyboard
- scrollUntilVisible:
    element: Verify & continue
    direction: DOWN
- tapOn: Verify & continue
- extendedWaitUntil:
    notVisible: Verify & continue
    timeout: 10000
- tapOn: Products
- extendedWaitUntil:
    visible: .*materials loaded
    timeout: 10000
- tapOn: Search cement, steel, sand…
- inputText: UltraTech
- hideKeyboard
- scrollUntilVisible:
    element: View UltraTech Super
    direction: DOWN
- tapOn: View UltraTech Super
- scrollUntilVisible:
    element: Add to cart.*
    direction: DOWN
    timeout: 15000
- tapOn: Add to cart.*
- extendedWaitUntil:
    visible: .*1 item.*
    timeout: 10000
