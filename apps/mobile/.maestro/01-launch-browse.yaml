# Smoke: the app starts, reaches the store API and lists real products.
appId: in.shivcement.store
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Browse materials
    timeout: 15000
- assertNotVisible: Cannot reach the store.*
- tapOn: Products
- extendedWaitUntil:
    visible: .*materials loaded
    timeout: 10000
- tapOn: Search cement, steel, sand…
- inputText: UltraTech
- hideKeyboard
- scrollUntilVisible:
    element: View UltraTech Super
    direction: DOWN
- tapOn: View UltraTech Super
# Phase 2 moves the primary action above the fold; until then scroll to it.
- scrollUntilVisible:
    element: Add to cart.*
    direction: DOWN
    timeout: 15000
# Back returns to the product list. (It also clears the search; phase 2 keeps it.)
- back
- extendedWaitUntil:
    visible: .*materials loaded
    timeout: 10000
