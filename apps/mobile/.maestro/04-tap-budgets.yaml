# Runs after 03. Counts taps for the plan's budgets: rate to placed order 3, where is my order 1.
appId: in.shivcement.store
tags: [order]
---
- launchApp
- extendedWaitUntil:
    visible: Order again
    timeout: 20000
# Where is my order: on Home already, and one tap for its page.
- tapOn: Track
- extendedWaitUntil:
    visible: Waiting for the shop
    timeout: 10000
- back
# Add, list bar, Place order: 3 taps with a saved site.
- tapOn: Add Dalmia DSP to your list # 1
- tapOn: Your list, .* # 2
- extendedWaitUntil:
    visible: Place order.*
    timeout: 15000
- tapOn: Place order.* # 3
- extendedWaitUntil:
    visible: Waiting for the shop
    timeout: 15000
