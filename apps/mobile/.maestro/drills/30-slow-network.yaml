# Slow 2G: the rates, search and a product still work, in order.
appId: in.shivcement.store
---
- launchApp
- extendedWaitUntil:
    visible: Today's rates
    timeout: 60000
- tapOn: Search
- inputText: UltraTech
- hideKeyboard
- tapOn: UltraTech Super, .*
- extendedWaitUntil:
    visible: (Add · .*|Added. See your list)
    timeout: 30000
- back
- back
