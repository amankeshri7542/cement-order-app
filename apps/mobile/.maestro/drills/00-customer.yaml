# Sets up the customer the drills use: a saved site, and something on the list. Local API only.
appId: in.shivcement.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Today's rates
    timeout: 30000
- tapOn:
    text: Account
    index: 0
- tapOn: Sign in
- tapOn: Mobile number
- inputText: ${PHONE}
- hideKeyboard
- tapOn: Get code
- hideKeyboard
- extendedWaitUntil:
    visible: Local development code.*
    timeout: 15000
- copyTextFrom:
    text: Local development code.*
- evalScript: ${output.code = maestro.copiedText.match(/\d{6}/)[0]}
- tapOn: Code from SMS
- inputText: ${output.code}
- pressKey: Enter
- extendedWaitUntil:
    visible: Sign out
    timeout: 20000
- tapOn: Sites.*
- tapOn: Add a site
- tapOn: Pincode
- inputText: '800001'
- pressKey: Enter
- inputText: Plot 7, Road 2
- hideKeyboard
- runFlow:
    when:
      visible: Area
    commands:
      - tapOn: Area
      - inputText: Boring Road
      - hideKeyboard
- scrollUntilVisible:
    element: Who receives it
    timeout: 5000
- tapOn: Who receives it
- inputText: Drill Customer
- hideKeyboard
- scrollUntilVisible:
    element: Save site
    timeout: 5000
- tapOn: Save site
- extendedWaitUntil:
    visible: Change .*
    timeout: 15000
- back
