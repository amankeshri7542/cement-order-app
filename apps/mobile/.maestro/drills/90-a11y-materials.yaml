# Opens the materials screen for scripts/android-a11y-audit.mjs (48dp targets, spoken names).
appId: in.shivcement.store
---
- launchApp
- extendedWaitUntil:
    visible: Current rates
    timeout: 30000
- tapOn:
    text: Materials
    index: 0
- extendedWaitUntil:
    visible: .*materials.*
    timeout: 30000
