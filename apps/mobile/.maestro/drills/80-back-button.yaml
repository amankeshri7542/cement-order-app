# Android Back closes a sheet, pops a screen, returns to Home, then leaves the app.
appId: in.shivcement.store
---
- launchApp
- extendedWaitUntil:
    visible: Today's rates
    timeout: 30000
- runFlow:
    when:
      notVisible: Your list, .*
    commands:
      - scrollUntilVisible:
          element: Add Dalmia DSP to your list
          timeout: 10000
      - tapOn: Add Dalmia DSP to your list
- tapOn: Your list, .*
- extendedWaitUntil:
    visible: Deliver to.*|Sign in to order
    timeout: 15000
- back
- assertVisible: Today's rates
- tapOn: Search
- hideKeyboard
- back
- assertVisible: Today's rates
- tapOn:
    text: Account
    index: 0
- back
- assertVisible: Today's rates
- back
- assertNotVisible: Today's rates
