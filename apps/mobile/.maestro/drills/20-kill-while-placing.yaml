# The app is killed right after Place order. On reopening, an unconfirmed request is checked with the
# same key, and is never sent as a second order. Start with an order ready in the panel.
appId: in.shivcement.store
---
- tapOn: Place order.*
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Today's rates
    timeout: 30000
- runFlow:
    when:
      visible: Not sure this reached us.*
    commands:
      - tapOn: Not sure this reached us.*
      - tapOn: Check my order
      - extendedWaitUntil:
          visible: Waiting for the shop
          timeout: 30000
